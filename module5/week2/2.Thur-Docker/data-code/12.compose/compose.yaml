services:

  api:
    build: ./api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build: ./client
    depends_on:
      api:
        condition: service_healthy