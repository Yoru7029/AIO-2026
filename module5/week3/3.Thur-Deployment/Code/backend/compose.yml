services:
  backend:
    image: thuannan/backend:v0.0.1
    container_name: backend
    restart: always
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"    # Mở cổng 80 duy nhất ra Internet
      - "443:443"  # Mở cổng 443 nếu sau này làm SSL
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend