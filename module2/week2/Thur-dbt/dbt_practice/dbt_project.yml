name: olist_dbt_practice
version: '1.0.0'
config-version: 2

profile: sql_transform_practice

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  olist_dbt_practice:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  olist_dbt_practice:
    +schema: raw
    raw_orders:
      +column_types:
        order_id: varchar(20)
        customer_id: varchar(20)
        order_status: varchar(30)
        order_purchase_timestamp: varchar(30)
        order_approved_at: varchar(30)
        order_delivered_customer_date: varchar(30)
        order_estimated_delivery_date: varchar(30)
    raw_order_items:
      +column_types:
        order_item_id: integer
        price: numeric(12,2)
        freight_value: numeric(12,2)
    raw_payments:
      +column_types:
        payment_sequential: integer
        payment_installments: integer
        payment_value: numeric(12,2)
    raw_reviews:
      +column_types:
        review_score: integer
