version: 2

models:
  - name: mart_orders
    description: Analytics-ready order-level mart. One row per order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: delivery_status
        tests:
          - not_null
          - accepted_values:
              values: ['On Time', 'Late', 'Not Delivered']

  - name: mart_monthly_revenue
    description: Monthly revenue KPI table with growth and running revenue.
    columns:
      - name: order_month
        tests:
          - unique
          - not_null
      - name: revenue
        tests:
          - not_null

  - name: mart_category_performance
    description: Category-level revenue, freight, percent contribution, and rank.
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
      - name: revenue
        tests:
          - not_null
      - name: category_rank
        tests:
          - not_null

  - name: mart_delivery_performance
    description: Monthly delivery performance with late delivery rate.
    columns:
      - name: order_month
        tests:
          - unique
          - not_null

  - name: mart_review_delivery_analysis
    description: Review score comparison by delivery status.
    columns:
      - name: delivery_status
        tests:
          - unique
          - not_null

  - name: mart_payment_summary
    description: Payment method summary with percent contribution and rank.
    columns:
      - name: payment_type
        tests:
          - unique
          - not_null
      - name: payment_value_rank
        tests:
          - not_null

  - name: mart_state_monthly_kpi
    description: Final challenge solution. Monthly revenue KPI by customer state.
    columns:
      - name: order_month
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
